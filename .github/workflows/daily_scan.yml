name: Daily Yield-Gap Scan

on:
  schedule:
    # 毎日 21:00 JST (12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "動作確認用の対象銘柄数の上限（空欄なら全銘柄をスキャン）"
        required: false
        default: ""

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python scanner/run_scan.py --limit "${{ github.event.inputs.limit }}"
          else
            python scanner/run_scan.py
          fi

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.csv
          git diff --cached --quiet || git commit -m "chore: update daily scan results"
          git push
